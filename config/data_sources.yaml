# Data source and dataset-shape configuration

# Global license gate, applied at final dedup_and_bin.py stage regardless of
# source. Per-source config below can ALSO filter earlier (cheaper to skip
# a download than to discard it after the fact), but this is the single
# source of truth for what's allowed into the training set.
license_policy:
  allowed_licenses:
    ["CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0", "MIT", "ODbL-1.0", "PDDL-1.0", "public-domain"]
  # Government open-data portals (data.gov, data.norge.no, Eurostat, Socrata,
  # OWID) are policy-vetted at the portal level, so datasets from those
  # sources are kept even when per-dataset license metadata is
  # missing/unstructured -- still recorded verbatim in the manifest for
  # auditability, just not used as a filter gate the way it is for
  # Kaggle/GitHub.
  trust_portal_level_for_sources: ["gov_data"]
  # For sources NOT in trust_portal_level_for_sources (kaggle, github_csv_search):
  # a dataset with missing/unrecognized license metadata is dropped, not kept.
  unknown_license_action: "drop"

sources:
  kaggle:
    enabled: true
    max_datasets: 5000
    query_terms: ["csv", "spreadsheet", "survey", "inventory", "records"]

  gov_data:
    enabled: true
    data_gov:
      # Disabled: requires registering for a free API key at
      # https://api.data.gov/signup/ (the shared DEMO_KEY fallback is too
      # rate-limited for a real scrape run) -- skipped in favor of the four
      # sources below, none of which need registration.
      enabled: false
      endpoint: "https://api.gsa.gov/technology/datagov/v3/action/package_search"
      query_terms: ["csv", "dataset", "survey", "inventory"]
      max_datasets: 2000

    data_norge:
      enabled: true
      # Old GET /api/dcat/datasets endpoint was retired; data.norge.no now
      # exposes a POST-based Elasticsearch API. No auth needed, but rate
      # limited to 10 req/min (burst 20) -- see REQUEST_DELAY_S_DATA_NORGE
      # in scrape_gov_data.py, which is tuned to that limit specifically.
      endpoint: "https://search.api.fellesdatakatalog.digdir.no/search/datasets"
      query_terms: ["csv"]  # useful for NO/Nordic headers
      max_datasets: 1500

    eurostat:
      enabled: true
      endpoint: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data"
      # Eurostat isn't a free-text-searchable catalog like CKAN -- you fetch
      # by known dataset code. Fill in codes of interest here; the table
      # listing at https://ec.europa.eu/eurostat/databrowser/ has the codes.
      dataset_codes: ["tps00001", "nama_10_gdp", "demo_pjan"]

    socrata:
      enabled: true
      # Cross-portal Discovery API -- covers hundreds of US federal/state/
      # city open-data portals (data.cdc.gov, data.cityofnewyork.us,
      # data.texas.gov, etc.) running on the Socrata platform, in one query.
      endpoint: "https://api.us.socrata.com/api/catalog/v1"
      max_datasets: 1000
      query_terms: ["csv", "demographics", "survey", "health", "metrics"]

    owid:
      enabled: true
      # Our World in Data: direct GitHub CSV downloads rather than an API.
      # All three URLs verified live as of writing (HTTP 200, real CSV
      # content). Add more from https://github.com/owid as needed --
      # OWID hosts one repo per dataset family, each with a master CSV at
      # a predictable raw.githubusercontent.com path.
      datasets:
        - name: "co2_data"
          url: "https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv"
        - name: "energy_data"
          url: "https://raw.githubusercontent.com/owid/energy-data/master/owid-energy-data.csv"
        - name: "covid_19_data"
          url: "https://raw.githubusercontent.com/owid/covid-19-data/master/public/data/owid-covid-data.csv"

  github_csv_search:
    enabled: true
    # Uses GitHub's code search API for standalone .csv files
    max_files: 5000
    min_stars: 0   # intentionally unfiltered; dedup + license gate handle junk
    query_terms: ["extension:csv"]

# Dataset shape targets: sample log-uniformly across BOTH axes independently
# so combinations like "20 rows x 100 cols" are represented, not just the
# "typical" region near a few hundred rows x 15 cols.
shape_bins:
  rows:
    min: 30
    max: 3000
    n_bins: 6          # log-spaced bin edges
  cols:
    min: 2
    max: 150
    n_bins: 6
  target_per_bin: 150   # aim for ~even coverage; oversample-heavy bins get capped

# Applied at dedup_and_bin.py's finalize() step, AFTER shape-bin sampling
# above but BEFORE writing to data/raw_csv/. This is a correctness fix, not
# just a size optimization: screenshot rendering never actually scrolls to
# reveal rows/columns beyond the initial viewport (see
# render_libreoffice.py's apply_config docstring), so training on the full
# original file as the target text means the model is taught to output
# content for rows/columns it was never shown a single pixel of on any
# source CSV bigger than this cap. Truncating both the rendered document
# and the training target to the same fixed size guarantees they match.
#
# Interaction worth knowing: shape_bins.rows.max above still governs which
# SOURCE files get sampled into the dataset (for diversity of file
# characteristics pre-truncation), but every accepted file gets rendered
# and trained on as if it were at most this size -- so most of the value
# of sampling deep into the upper end of shape_bins.rows now comes from
# which rows/cols happen to survive truncation (always the first N), not
# from actual visual "this is a huge sheet" diversity. If that bothers you,
# lowering shape_bins.rows.max/cols.max to roughly match these values
# would make the earlier sampling stage's intent line up with what
# actually reaches training.
render_cap:
  max_rows: 150   # includes header row
  max_cols: 40

dedup:
  method: "content_hash"   # sha256 over normalized (sorted columns, stripped whitespace) content
  near_dup_threshold: 0.97  # jaccard sim on column-header + dtype signature, catches re-uploads

output:
  staging_dir: "data/staging/raw_downloads"      # scrapers write here, any format
  normalized_dir: "data/staging/normalized"      # normalize_to_csv.py writes canonical CSVs here
  raw_csv_dir: "data/raw_csv"                    # dedup_and_bin.py's final accepted output
  sources_manifest_path: "data/manifests/sources_manifest.jsonl"     # scraper provenance
  normalized_manifest_path: "data/manifests/normalized_manifest.jsonl"
  final_manifest_path: "data/manifests/raw_csv_manifest.jsonl"       # what training reads from
